{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Designs</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* General Body Styling */
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f8f9fa;
            color: #343a40;
            line-height: 1.6;
        }
        /* Navbar Styling */
        .navbar {
            background: linear-gradient(90deg, #004085, #0056b3);
        }
        .navbar-brand {
            font-size: 1.5rem;
            font-weight: bold;
        }
        .nav-link {
            color: #ffffff !important;
            transition: color 0.3s ease-in-out;
        }
        .nav-link:hover {
            color: #ffd700 !important; /* Gold Color */
        }
        /* Footer Styling */
        footer {
            background-color: #004085;
            color: #ffffff;
            padding: 15px 0;
            font-size: 0.9rem;
        }
        footer a {
            color: #ffd700;
            text-decoration: none;
        }
        footer a:hover {
            text-decoration: underline;
        }
        /* Buttons */
        .btn-primary, .btn-danger {
            transition: transform 0.3s ease;
        }
        .btn-primary:hover, .btn-danger:hover {
            transform: scale(1.1);
        }
        /* Table Styling */
        .table thead {
            background-color: #004085;
            color: #ffffff;
        }
        .table td, .table th {
            vertical-align: middle;
        }
        /* Forms */
        input.form-control, select.form-control, textarea.form-control {
            border: 1px solid #ced4da;
        }
        label {
            font-weight: bold;
        }
    </style>
</head>
<body>
<header>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'cases:home' %}">
                <i class="fas fa-gavel"></i>🏠 Urban Design
            </a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'cases:client_list' %}">Customers</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'cases:lawyer_list' %}">Vendors</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'cases:case_list' %}">Projects</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-3 text-center">
        {% if user.is_authenticated %}
            <form id="logout-form" method="post" action="{% url 'cases:logout' %}" class="d-inline-block">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Log out</button>
            </form>
        {% else %}
            <a href="{% url 'cases:login' %}" class="btn btn-primary">Log in</a>
        {% endif %}
    </div>
</header>
<main role="main" class="container mt-4">
    {% block content %}
        <!-- Page-specific content goes here -->
    {% endblock %}
</main>
<footer>
    <div class="container text-center">
        <p>&copy; {% now 'Y' %}  شركة ايربن ديزاين للتشطيبات الداخليه - جميع الحقوق محفوظة.</p>
    </div>
</footer>

<!-- Bootstrap Bundle with Popper -->
<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
